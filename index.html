<style>
/* Layout: one pinned full-screen stage; the page scroll drives the camera from Dubai street level out to the whole planet */
:root{
  --bg:#FFFFFF;
  --rain:#6E7781;
  --rain-head:#1F2328;
  --accent:#D85A30;
  --ink:#1E2B25;
  --muted:#5F6E66;
  --field:#1D63C8;
  --font:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1013;--rain:#8E969F;--rain-head:#EEF0F2;--ink:#E6E9EC;--muted:#9AA3AC;--field:#8DBDFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1013;--rain:#8E969F;--rain-head:#EEF0F2;--ink:#E6E9EC;--muted:#9AA3AC;--field:#8DBDFF;color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font)}
.track{position:relative;height:560vh}
.stage{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-bottom,0px))}
.bar{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.bar b{color:var(--ink);font-weight:600;letter-spacing:.02em}
.bar .sp{flex:1}
.chip{background:var(--bg);padding:3px 8px;border-radius:4px}
.foot{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.intro{max-width:30ch;background:var(--bg);padding:12px 14px;border-radius:6px;transition:opacity .2s}
.intro h1{font-size:clamp(28px,5vw,44px);line-height:1;margin:0 0 8px;font-weight:600;letter-spacing:-.01em;color:var(--rain-head);text-wrap:balance}
.intro p{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.cue{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--bg);padding:8px 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--rain) 35%,transparent);display:flex;gap:8px;align-items:center}
.cue i{font-style:normal;display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.grab{position:absolute;border-radius:50%;touch-action:none;cursor:grab;pointer-events:none}
.grab.on{pointer-events:auto}
.grab:active{cursor:grabbing}
.ident{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;top:0;left:0;z-index:2;pointer-events:none;box-sizing:border-box;max-width:min(100%,38em);padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(22px,env(safe-area-inset-top,0px));padding-left:max(24px,env(safe-area-inset-left,0px));
  font-family:var(--font);font-size:13px;line-height:1.5;letter-spacing:.01em}
.ident b{display:block;font-weight:600;color:var(--rain-head)}
.ident span{display:block;font-weight:400;color:var(--rain)}
@media (max-width:640px){.ident{font-size:12px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}}
.logo{position:absolute;z-index:3;pointer-events:none;height:19px;width:auto;top:max(22px,env(safe-area-inset-top,0px));left:max(24px,env(safe-area-inset-left,0px));opacity:0}
.logo.on{opacity:1;transform:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1) brightness(1.1)}}
:root[data-theme="dark"] .logo{filter:invert(1) brightness(1.1)}
@media (max-width:640px){.logo{height:16px;top:max(16px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px))}}
@media (prefers-reduced-motion:reduce){.cue i{animation:none}}
.chlist{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 32px);margin:0;padding:0;list-style:none;
  display:flex;flex-wrap:wrap;justify-content:center;gap:2px 13px;font-family:var(--font);font-size:10px;line-height:1.6;letter-spacing:.06em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .4s}
.chlist.on{pointer-events:auto}
.chlist a{color:var(--muted);text-decoration:none;display:flex;gap:5px;background:var(--bg);padding:0 2px}
.chlist a i{font-style:normal;opacity:.5}
.chlist a:hover,.chlist a:focus-visible,.chlist a.lit{color:var(--ink)}
@media (max-width:640px){.chlist{font-size:9.5px;gap:0 10px}}
</style>

const RY=t=>{const c=Math.cos(t),s=Math.sin(t);return[c,0,s,0,1,0,-s,0,c]};
const RX=t=>{const c=Math.cos(t),s=Math.sin(t);return[1,0,0,0,c,-s,0,s,c]};
const RA=(u,t)=>{const c=Math.cos(t),s=Math.sin(t),k=1-c,[x,y,z]=u;return[c+x*x*k,x*y*k-z*s,x*z*k+y*s,y*x*k+z*s,c+y*y*k,y*z*k-x*s,z*x*k-y*s,z*y*k+x*s,c+z*z*k]};
